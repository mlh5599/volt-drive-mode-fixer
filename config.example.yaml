# Volt Drive Mode Fixer -- example config.
# Schema and rationale: see DESIGN.md "Mode policy".
#
# The daemon boots armed and runs a level-triggered reconciler against a
# three-position selector the driver advances with a panel SW1 tap:
#
#   1. hold      hold the pack at `hold_threshold_percent`. Passive above it,
#                so a restart on a healthy pack leaves the car where it is;
#                the SOC-HOLD floor walks the car to HOLD once it drops.
#   2. mountain  enforce MOUNTAIN continuously (the floor still wins).
#   3. off       do nothing, floor disabled -- the car behaves as if the
#                device were not plugged in.
#
# A fourth tap returns to `hold`. `voltdmf-ctl disarm` is the mid-drive stop.

policy:
  default_position: hold        # hold | mountain | off -- boot detent, not
                                # persisted; every key cycle starts here.
  hold_threshold_percent: 30    # floor forces HOLD at/below this diag SOC
  hold_reset_percent: 41        # floor releases at/above this (hysteresis;
                                # 41% is the 3-bar mark, Session-9 calibration)
  bar_failsafe_raw: 9           # 0x096 b3 <= this forces HOLD if the poll is stale
                                # (~2 gauge bars; Session-9 calibration)

soc_poll:
  enabled: true                 # run the 22 005B UDS poll for ground-truth SOC
  period_seconds: 10            # request cadence
