# Volt Drive Mode Fixer -- example config.
# Schema and rationale: see DESIGN.md "Mode policy".
#
# The daemon boots armed and runs a level-triggered reconciler against a
# four-position selector the driver advances with a panel SW1 tap:
#
#   1. hold-soc  hold the pack at `hold_threshold_percent`. Passive above it,
#                so a healthy pack drives normally; once it drops, the
#                SOC-HOLD floor walks the car to HOLD and *keeps* it there
#                for the rest of the key cycle.
#   2. hold-now  enforce HOLD immediately, whatever the pack reads -- "bank
#                what I have left, starting now".
#   3. mountain  enforce MOUNTAIN continuously (the floor still wins).
#   4. off       do nothing, floor disabled -- the car behaves as if the
#                device were not plugged in.
#
# A fifth tap returns to `hold-soc`. `voltdmf-ctl disarm` is the mid-drive
# stop; tapping round to `off` is the only way to clear a latched floor
# without restarting.

policy:
  default_position: hold-soc    # hold-soc | hold-now | mountain | off -- boot
                                # detent, not persisted; every key cycle
                                # starts here.
  hold_threshold_percent: 30    # floor forces HOLD at/below this diag SOC and
                                # latches for the rest of the key cycle (no
                                # release percent; 30% is mid-2-bar,
                                # Session-9 calibration)
  bar_failsafe_raw: 9           # 0x096 b3 <= this forces HOLD if the poll is stale
                                # (~2 gauge bars; Session-9 calibration)

soc_poll:
  enabled: true                 # run the 22 005B UDS poll for ground-truth SOC
  period_seconds: 10            # request cadence
