# Volt Drive Mode Fixer -- example config.
# Schema and rationale: see DESIGN.md "Mode policy".
#
# The daemon boots armed and runs a level-triggered reconciler. With
# `default_setpoint: auto` it enforces nothing until the driver picks HOLD or
# MOUNTAIN with the panel button (or `voltdmf-ctl setpoint`); a restart on a
# healthy pack then leaves the car where it is. The SOC-HOLD floor still
# overrides to HOLD whenever the pack is low, from any setpoint including auto.
# `voltdmf-ctl disarm` is the mid-drive stop.

policy:
  default_setpoint: auto        # auto | hold | mountain -- boot value, not persisted.
                                # auto: no target until the driver selects one
                                # or the SOC floor engages.
  hold_threshold_percent: 33    # floor forces HOLD at/below this diag SOC
  hold_reset_percent: 41        # floor releases at/above this (hysteresis)
  bar_failsafe_raw: 9           # 0x096 b3 <= this forces HOLD if the poll is stale
                                # (~2 gauge bars; Session-9 calibration)

soc_poll:
  enabled: true                 # run the 22 005B UDS poll for ground-truth SOC
  period_seconds: 10            # request cadence
