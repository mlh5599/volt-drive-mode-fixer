# Drop-in for layering the runtime control socket onto a voltdmf.service that
# is managed elsewhere (e.g. the Ansible `roles/voltdmf` unit on voltpi, which
# runs as User=voltdmf + AmbientCapabilities=CAP_NET_RAW). Install this dir as
# /etc/systemd/system/voltdmf.service.d/ alongside voltdmf.socket instead of
# editing the managed unit; delete the drop-in to revert.
#
# If you deploy this repo's own systemd/voltdmf.service, it already carries
# these two lines and this drop-in is redundant (harmless).
[Unit]
Requires=voltdmf.socket
After=voltdmf.socket
